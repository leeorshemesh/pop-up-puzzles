<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop Up Puzzles</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/play.css">
</head>
<body>
    <div class="app">
        <section id="screen-home">
            <header class="topbar">
                <button type="button" id="btn-profile" class="avatar-btn" aria-label="Open profile">
                    <span class="avatar avatar-sm" data-avatar></span>
                </button>
                <h1>Pop Up Puzzles</h1>
                <div class="top-actions">
                    <button type="button" id="btn-shop" class="icon-btn" aria-label="Open shop">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 8h12l-1 12H7L6 8z" fill="none" stroke="currentColor" stroke-width="1.8"></path>
                            <path d="M9 8V7a3 3 0 0 1 6 0v1" fill="none" stroke="currentColor" stroke-width="1.8"></path>
                        </svg>
                        <span id="trophy-chip" class="trophy-chip">0</span>
                    </button>
                    <div class="pop-anchor">
                        <button type="button" id="btn-home-settings" class="icon-btn gear-btn" aria-expanded="false" aria-controls="home-settings" aria-label="Settings">
                            <svg class="gear-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm8.2 2.6-1.7-.3a6.8 6.8 0 0 0-.8-1.9l1.1-1.3-1.4-1.4-1.3 1.1a6.8 6.8 0 0 0-1.9-.8l-.3-1.7h-2l-.3 1.7a6.8 6.8 0 0 0-1.9.8L8.4 5.2 7 6.6l1.1 1.3a6.8 6.8 0 0 0-.8 1.9l-1.7.3v2l1.7.3c.16.68.44 1.32.8 1.9L7 16.6 8.4 18l1.3-1.1c.58.36 1.22.64 1.9.8l.3 1.7h2l.3-1.7c.68-.16 1.32-.44 1.9-.8l1.3 1.1 1.4-1.4-1.1-1.3c.36-.58.64-1.22.8-1.9l1.7-.3v-2z" fill="currentColor"></path>
                            </svg>
                        </button>
                        <div id="home-settings" class="popout" hidden>
                            <label class="switch-row">
                                <span>Dark mode</span>
                                <input type="checkbox" id="theme-home">
                            </label>
                            <label class="switch-row">
                                <span>Hide timers</span>
                                <input type="checkbox" id="hide-timer">
                            </label>
                        </div>
                    </div>
                </div>
            </header>
            <div class="puzzle-grid" id="puzzle-grid"></div>
        </section>

        <section id="screen-profile" hidden>
            <header class="subbar">
                <button type="button" class="text-btn" data-back-home>Back</button>
                <h1>Profile</h1>
            </header>
            <div class="panel">
                <div class="avatar avatar-lg" data-avatar></div>
                <label class="field">
                    <span>Name</span>
                    <input type="text" id="profile-name" maxlength="24" autocomplete="nickname">
                </label>
                <div class="swatch-block">
                    <p>Skin</p>
                    <div class="swatches" id="skin-swatches"></div>
                </div>
                <div class="swatch-block">
                    <p>Shirt</p>
                    <div class="swatches" id="shirt-swatches"></div>
                </div>
                <p class="stat-line">Trophies: <strong id="profile-trophies">0</strong></p>
                <ul class="stats" id="profile-stats"></ul>
            </div>
        </section>

        <section id="screen-shop" hidden>
            <header class="subbar">
                <button type="button" class="text-btn" data-back-home>Back</button>
                <h1>Shop</h1>
                <span id="shop-trophies" class="trophy-chip">0</span>
            </header>
            <div class="shop-list" id="shop-list"></div>
        </section>

        <section id="screen-play" hidden>
            <header class="play-bar">
                <button type="button" id="btn-play-back" class="text-btn">Back</button>
                <h1 id="play-title">Sudoku</h1>
                <div class="pop-anchor" id="play-menu-wrap">
                    <button type="button" id="btn-menu" class="menu-btn" aria-expanded="false" aria-controls="play-menu" aria-label="Menu">
                        <span></span><span></span><span></span>
                    </button>
                    <div id="play-menu" class="popout menu-pop" hidden>
                        <button type="button" id="btn-hint">Reveal Hint</button>
                        <button type="button" id="btn-solve">Reveal Solution</button>
                        <button type="button" id="btn-check">Check Puzzle</button>
                        <button type="button" id="btn-restart">Restart</button>
                        <label class="switch-row">
                            <span>Dark mode</span>
                            <input type="checkbox" id="theme-play">
                        </label>
                    </div>
                </div>
            </header>

            <div id="sudoku-play">
                <p id="status-message" class="status" aria-live="polite"></p>
                <div class="board-tools">
                    <span id="timer-display" class="timer-display">00:00</span>
                    <button type="button" id="btn-pause" class="icon-btn pause-btn" aria-label="Pause">
                        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect>
                            <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect>
                        </svg>
                        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5v14l11-7z" fill="currentColor"></path>
                        </svg>
                    </button>
                </div>
                <div class="board-stage">
                    <div id="sudoku-board" role="grid" aria-label="Sudoku board"></div>
                    <div id="pause-overlay" class="pause-overlay" hidden></div>
                </div>
                <label class="notes-switch">
                    <span>Notes</span>
                    <button type="button" id="btn-notes" role="switch" aria-checked="false"></button>
                </label>
                <div class="pad" id="keypad">
                    <button type="button" class="key" data-value="1">1</button>
                    <button type="button" class="key" data-value="2">2</button>
                    <button type="button" class="key" data-value="3">3</button>
                    <button type="button" class="key" data-value="4">4</button>
                    <button type="button" class="key" data-value="5">5</button>
                    <button type="button" class="key" data-value="6">6</button>
                    <button type="button" class="key" data-value="7">7</button>
                    <button type="button" class="key" data-value="8">8</button>
                    <button type="button" class="key" data-value="9">9</button>
                    <button type="button" class="key key-erase" data-value="erase">Erase</button>
                </div>
            </div>

            <div id="coming-soon" class="coming-soon" hidden>
                <p id="coming-soon-copy">This puzzle is coming soon.</p>
            </div>
        </section>
    </div>

    <div id="victory-modal" class="modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="victory-title">
            <h2 id="victory-title">Puzzle solved</h2>
            <p id="win-time-row">You finished in <span id="win-time">00:00</span>.</p>
            <p id="win-trophy"></p>
            <button type="button" id="btn-play-again" class="btn btn-primary">Play again</button>
        </div>
    </div>

    <div id="confirm-modal" class="modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-message">
            <p id="confirm-message"></p>
            <div class="modal-actions">
                <button type="button" id="btn-confirm-cancel" class="btn">Cancel</button>
                <button type="button" id="btn-confirm-ok" class="btn btn-primary">Restart</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/puzzles.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/sudoku.js"></script>
    <script src="js/placeholders.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
